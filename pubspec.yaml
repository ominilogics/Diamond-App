name: daimond
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  go_router: ^17.3.0
  flutter_svg: ^2.3.0
  intl: ^0.20.2
  flutter_riverpod: ^2.6.1
  flutter_hooks: ^0.21.3+1
  hooks_riverpod: ^2.6.1
  path_provider: ^2.1.6
  drift: ^2.34.0
  sqlite3_flutter_libs: ^0.5.20
  path: ^1.9.0
  supabase_flutter: ^2.5.4
  flutter_dotenv: ^5.1.0
  fluttertoast: ^9.1.0
  permission_handler: ^12.0.3
  flutter_contacts: ^1.1.9

  device_info_plus: 11.3.0
  google_sign_in: ^6.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  uuid: ^4.5.3
  file_picker: ^8.1.2
  purchases_flutter: ^10.4.0
  url_launcher: ^6.3.2
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  app_badge_plus: ^1.3.2
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  shared_preferences: ^2.5.5
  app_links: ^6.3.0
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.20.0
  rename: ^3.1.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icons/app_logo.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/pictures/
    - .env

  fonts:
    - family: ColitezSerif
      fonts:
        - asset: assets/fonts/ColitezSerif-Italic.otf
          style: italic
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
    - family: BIZUDMincho
      fonts:
        - asset: assets/fonts/BIZUDMincho-Regular.ttf

flutter_native_splash:
  color: "#ffffff"
  color_dark: "#ffffff"
  image: "assets/icons/app_logo_round.png"
  android_12:
    color: "#ffffff"
    color_dark: "#ffffff"
    image: "assets/icons/app_logo.png"
  ios: true
  android: true
  web: false

