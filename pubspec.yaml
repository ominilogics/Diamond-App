name: daimond
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  go_router: ^17.3.0
  flutter_svg: ^2.3.0
  intl: ^0.20.2
  flutter_riverpod: ^2.6.1
  flutter_hooks: ^0.21.3+1
  hooks_riverpod: ^2.6.1
  path_provider: ^2.1.6
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.20
  path: ^1.9.0
  supabase_flutter: ^2.5.4
  flutter_dotenv: ^5.1.0
  fluttertoast: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.20.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/pictures/
    - .env

  fonts:
    - family: ColitezSerif
      fonts:
        - asset: assets/fonts/ColitezSerif-Italic.otf
          style: italic
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
