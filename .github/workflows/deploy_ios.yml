name: Build & Release iOS (IPA)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Version
        run: flutter --version

      - name: Create .env File
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env
          else
            touch .env
          fi

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporary-build-password-123' }}
        run: |
          # 1. Variables
          CERTIFICATE_RAW=$RUNNER_TEMP/raw_certificate.p12
          CERTIFICATE_CLEAN=$RUNNER_TEMP/clean_certificate.p12
          PEM_TEMP=$RUNNER_TEMP/temp_cert_key.pem
          export PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          export CERTIFICATE_RAW
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # 2. Decode secrets using Python (bulletproof against OS newline & BSD base64 quirks)
          python3 -c "import base64, os; open(os.environ['CERTIFICATE_RAW'], 'wb').write(base64.b64decode(os.environ['BUILD_CERTIFICATE_BASE64']))"
          python3 -c "import base64, os; open(os.environ['PP_PATH'], 'wb').write(base64.b64decode(os.environ['BUILD_PROVISION_PROFILE_BASE64']))"

          # 3. Re-export via macOS LibreSSL to ensure 100% Apple Security keychain compatibility
          openssl pkcs12 -in "$CERTIFICATE_RAW" -nodes -passin "pass:$P12_PASSWORD" -out "$PEM_TEMP"
          openssl pkcs12 -export -in "$PEM_TEMP" -inkey "$PEM_TEMP" -out "$CERTIFICATE_CLEAN" -passout "pass:$P12_PASSWORD"

          # 4. Create temporary keychain and set as default
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # 5. Import clean certificate to keychain
          security import "$CERTIFICATE_CLEAN" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          # 6. Apply code signing partition list so codesign can access private key non-interactively
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 7. Verify code signing identity is registered and valid
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          # 8. Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/f2da7508-9c02-4004-bf4c-4b8f33a5a35e.mobileprovision


      - name: Install Dependencies
        run: |
          mkdir -p build/ios/SourcePackages
          flutter config --no-enable-swift-package-manager
          flutter pub get
          flutter precache --ios


      - name: Build iOS IPA
        run: |
          mkdir -p build/ios/SourcePackages
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: rivon-app-store-ipa
          path: build/ios/ipa/*.ipa

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          if [ -z "$APP_STORE_CONNECT_KEY_ID" ] && [ -z "$APP_SPECIFIC_PASSWORD" ]; then
            echo "No App Store Connect credentials configured in secrets. Skipping upload."
            exit 0
          fi

          IPA_PATH=$(ls build/ios/ipa/*.ipa 2>/dev/null | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "Error: No .ipa file found in build/ios/ipa/"
            exit 1
          fi
          echo "Found IPA at: $IPA_PATH"

          if [ -n "$APP_STORE_CONNECT_KEY_ID" ]; then
            echo "Uploading using App Store Connect API Key ($APP_STORE_CONNECT_KEY_ID)..."
            mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys
            echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8
            cp ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 ~/.private_keys/
            chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8 ~/.private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

            xcrun altool --upload-app --type ios \
              -f "$IPA_PATH" \
              --apiKey "$APP_STORE_CONNECT_KEY_ID" \
              --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          elif [ -n "$APP_SPECIFIC_PASSWORD" ]; then
            echo "Uploading using App-Specific Password for $APPLE_ID..."
            xcrun altool --upload-app --type ios \
              -f "$IPA_PATH" \
              --username "$APPLE_ID" \
              --password "$APP_SPECIFIC_PASSWORD"
          fi


