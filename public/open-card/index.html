<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digital Card Received - Rivon</title>
    <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary-purple: #7C3AED;
            --primary-gradient: linear-gradient(135deg, #7C3AED 0%, #9333EA 100%);
            --dark-gradient: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            --card-bg: rgba(255, 255, 255, 0.88);
            --card-border: rgba(255, 255, 255, 0.9);
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at 50% 0%, #F3E8FF 0%, #E8F5E9 50%, #FFFFFF 100%);
            min-height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 32px 24px;
            color: #0F172A;
            perspective: 1200px;
        }

        /* Ambient Animated Background Orbs */
        .ambient-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.6;
        }

        .orb-1 {
            top: -10%;
            left: 20%;
            width: 320px;
            height: 320px;
            background: rgba(168, 85, 247, 0.25);
            animation: orbFloat 8s ease-in-out infinite alternate;
        }

        .orb-2 {
            bottom: 5%;
            right: 15%;
            width: 380px;
            height: 380px;
            background: rgba(52, 211, 153, 0.2);
            animation: orbFloat 10s ease-in-out infinite alternate-reverse;
        }

        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 40px) scale(1.1); }
        }

        /* Main Scene & Tilt Container */
        .tilt-scene {
            width: 100%;
            max-width: 390px;
            z-index: 1;
            perspective: 1000px;
        }

        /* Glassmorphism Interactive Card */
        .tilt-card {
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-radius: 36px;
            border: 1px solid var(--card-border);
            box-shadow: 
                0 30px 70px rgba(0, 0, 0, 0.09), 
                0 12px 28px rgba(124, 58, 237, 0.08),
                inset 0 1px 1px rgba(255, 255, 255, 1);
            padding: 42px 26px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out, box-shadow 0.3s ease;
            cursor: pointer;
            overflow: hidden;
        }

        /* Interactive Dynamic Glare Overlay */
        .glare-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.7) 0%, rgba(255, 255, 255, 0) 70%);
            pointer-events: none;
            opacity: 0.5;
            transition: opacity 0.3s ease;
            border-radius: 36px;
        }

        /* Rivon Logo Container with 3D Float */
        .logo-wrapper {
            position: relative;
            margin-bottom: 24px;
            transform: translateZ(35px);
        }

        .logo-halo {
            position: absolute;
            inset: -8px;
            background: linear-gradient(135deg, #FF5E60 0%, #7C3AED 100%);
            border-radius: 28px;
            opacity: 0.35;
            filter: blur(10px);
            animation: haloPulse 3.5s ease-in-out infinite alternate;
        }

        .app-logo-img {
            position: relative;
            width: 88px;
            height: 88px;
            border-radius: 24px;
            object-fit: cover;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12);
        }

        @keyframes haloPulse {
            0% { transform: scale(0.96); opacity: 0.25; }
            100% { transform: scale(1.06); opacity: 0.45; }
        }

        /* Special Card Message Text */
        .special-message {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 16.5px;
            color: #1E293B;
            line-height: 1.55;
            margin-bottom: 30px;
            width: 100%;
            max-width: 310px;
            font-weight: 600;
            letter-spacing: -0.2px;
            transform: translateZ(25px);
        }

        .special-message .highlight-loved {
            background: linear-gradient(135deg, #FF2A54 0%, #FF5E60 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .special-message .highlight-app {
            color: #FF2A54;
            font-weight: 800;
        }

        /* Store Buttons Container */
        .actions-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 13px;
            transform: translateZ(20px);
        }

        .btn {
            width: 100%;
            padding: 15px 22px;
            border-radius: 22px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 15px;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.25s ease;
            cursor: pointer;
            border: none;
            position: relative;
            overflow: hidden;
        }

        /* Shimmer Effect on Button Hover */
        .btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s ease;
        }

        .btn:hover::after {
            left: 140%;
        }

        .btn-icon {
            width: 26px;
            height: 26px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-text-container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
        }

        .btn-caption {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            opacity: 0.8;
            line-height: 1;
            margin-bottom: 3px;
        }

        .btn-title {
            font-size: 16px;
            font-weight: 700;
            line-height: 1.15;
            letter-spacing: -0.2px;
        }

        /* Google Play Button */
        .btn-playstore {
            background: var(--dark-gradient);
            color: #FFFFFF;
            box-shadow: 0 10px 24px rgba(15, 23, 42, 0.22);
        }

        .btn-playstore:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 16px 32px rgba(15, 23, 42, 0.32);
        }

        .btn-playstore:active {
            transform: translateY(0) scale(0.99);
        }

        /* App Store Button */
        .btn-appstore {
            background: var(--primary-gradient);
            color: #FFFFFF;
            box-shadow: 0 10px 24px rgba(124, 58, 237, 0.28);
        }

        .btn-appstore:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 16px 32px rgba(124, 58, 237, 0.38);
        }

        .btn-appstore:active {
            transform: translateY(0) scale(0.99);
        }

        /* Mobile Screen Responsiveness */
        @media (max-width: 480px) {
            body {
                padding: 24px 20px;
            }
            .tilt-card {
                padding: 36px 20px;
                border-radius: 30px;
            }
            .app-logo-img {
                width: 80px;
                height: 80px;
                border-radius: 20px;
            }
            .special-message {
                font-size: 15px;
                line-height: 1.5;
                margin-bottom: 24px;
            }
            .btn {
                padding: 14px 18px;
                border-radius: 18px;
            }
            .footer-tag {
                font-size: 11.5px;
                margin-top: 20px;
            }
        }

        /* Footer Copyright-style Tag */
        .footer-tag {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 12px;
            font-weight: 500;
            color: #94A3B8;
            letter-spacing: 0.3px;
            margin-top: 24px;
            opacity: 0.85;
            transform: translateZ(15px);
        }
    </style>
</head>

<body>

    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>

    <div class="tilt-scene">
        <main class="tilt-card" id="tiltCard">
            <div class="glare-overlay" id="glareOverlay"></div>

            <div class="logo-wrapper">
                <div class="logo-halo"></div>
                <img src="app_logo.png" alt="Rivon App Logo" class="app-logo-img" />
            </div>

            <p class="special-message">
                You have received a personalized digital card from <span class="highlight-loved">a loved one</span>! Download the <span class="highlight-app">Rivon app</span> to open your envelope and view your card.
            </p>

            <div class="actions-group">
                <!-- Google Play Button -->
                <a href="https://play.google.com/store/apps/details?id=com.greetingcards.invitationmaker.rivon" id="playStoreBtn" class="btn btn-playstore" target="_blank">
                    <div class="btn-icon">
                        <svg width="24" height="24" viewBox="0 0 512 512">
                            <path fill="#41A5EE" d="M38.8 11.2C34.4 15.6 32 22.4 32 30.6v450.8c0 8.2 2.4 15 6.8 19.4l2.2 2.2L292.6 251.4v-4.4L41 9l-2.2 2.2z"/>
                            <path fill="#FFD400" d="M377.6 166.4l-85-85L292.6 81.4v4.4l85 85-85 85v4.4l85-85 62 35.8c17.6 10.2 17.6 26.8 0 37l-62 35.8z"/>
                            <path fill="#F3474B" d="M292.6 247l-85 85 170 170c17.6-10.2 46.4-56.8 46.4-73.8L292.6 247z"/>
                            <path fill="#32A071" d="M292.6 255.8l131.4-131.4L207.6 1.8C190-8.4 161.2 38.2 161.2 55.2l131.4 200.6z"/>
                        </svg>
                    </div>
                    <div class="btn-text-container">
                        <span class="btn-caption">GET IT ON</span>
                        <span class="btn-title">Google Play</span>
                    </div>
                </a>

                <!-- App Store Button -->
                <a href="https://apps.apple.com/us/app/rivon/id123456789" id="appStoreBtn" class="btn btn-appstore" target="_blank">
                    <div class="btn-icon">
                        <svg width="24" height="24" viewBox="0 0 170 170" fill="currentColor">
                            <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-5.02.12-9.88-1.93-14.58-6.17-3.41-2.95-7.3-7.79-11.67-14.52-6.53-10.13-11.67-21.36-15.43-33.68-3.76-12.32-5.64-24.08-5.64-35.28 0-15.08 3.76-27.42 11.28-37.03 7.52-9.61 16.91-14.54 28.16-14.78 4.83 0 10.19 1.18 16.08 3.54 5.89 2.36 9.87 3.54 11.94 3.54 1.83 0 5.95-1.24 12.36-3.72 6.41-2.48 11.85-3.6 16.33-3.36 12.26.83 22.06 5.49 29.39 13.98-10.96 6.6-16.32 15.79-16.08 27.57.24 9.19 3.82 16.85 10.74 22.98 6.92 6.13 15.02 9.78 24.3 10.96-2.59 7.89-6.07 15.8-10.45 23.73zM119.22 31.09c0-6.72 2.42-13.12 7.26-19.2 4.84-6.08 10.87-9.76 18.09-11.05.24.95.36 1.83.36 2.65 0 6.6-2.48 13.06-7.44 19.38-4.96 6.32-11.02 10.02-18.17 11.1-0.1-0.95-0.1-1.91-0.1-2.88z"/>
                        </svg>
                    </div>
                    <div class="btn-text-container">
                        <span class="btn-caption">DOWNLOAD ON THE</span>
                        <span class="btn-title">App Store</span>
                    </div>
                </a>
            </div>

            <p class="footer-tag">Free on iOS &amp; Android</p>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Interactive 3D Tilt Effect on Mouse Move
            const card = document.getElementById('tiltCard');
            const glare = document.getElementById('glareOverlay');

            document.addEventListener('mousemove', function (e) {
                const rect = card.getBoundingClientRect();
                const cardCenterX = rect.left + rect.width / 2;
                const cardCenterY = rect.top + rect.height / 2;

                const mouseX = e.clientX - cardCenterX;
                const mouseY = e.clientY - cardCenterY;

                // Calculate tilt angles (max 12 degrees)
                const rotateX = (-mouseY / (rect.height / 2)) * 12;
                const rotateY = (mouseX / (rect.width / 2)) * 12;

                card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

                // Dynamic glare light position
                const glareX = 50 + (mouseX / rect.width) * 40;
                const glareY = 50 + (mouseY / rect.height) * 40;
                glare.style.background = `radial-gradient(circle at ${glareX}% ${glareY}%, rgba(255, 255, 255, 0.7) 0%, rgba(255, 255, 255, 0) 65%)`;
            });

            // Reset tilt when mouse leaves window
            document.addEventListener('mouseleave', function () {
                card.style.transform = `rotateX(0deg) rotateY(0deg)`;
                glare.style.background = `radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.7) 0%, rgba(255, 255, 255, 0) 70%)`;
            });

            // Auto Launch Mobile Intent
            const userAgent = navigator.userAgent || navigator.vendor || window.opera;
            const isAndroid = /android/i.test(userAgent);
            const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;

            function triggerAppLaunch() {
                const search = window.location.search || '';
                if (isAndroid) {
                    const intentUri = `intent://rivon-62e8a.web.app/open-card${search}#Intent;scheme=https;package=com.greetingcards.invitationmaker.rivon;end;`;
                    window.location.href = intentUri;
                } else if (isIOS) {
                    window.location.href = `rivon://open-card${search}`;
                }
            }

            if (isAndroid || isIOS) {
                setTimeout(function () {
                    triggerAppLaunch();
                }, 400);
            }
        });
    </script>
</body>

</html>
