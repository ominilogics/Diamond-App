<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You've Received a Card!</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
            color: #333;
            text-align: center;
            padding: 20px;
        }
        .icon {
            width: 80px;
            height: 80px;
            background-color: #3498db;
            border-radius: 20px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            font-weight: bold;
        }
        h2 {
            margin: 0 0 10px 0;
            font-size: 24px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            max-width: 300px;
            line-height: 1.5;
        }
        .btn {
            padding: 14px 28px;
            background-color: #007aff;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            display: inline-block;
            transition: background-color 0.2s;
        }
        .btn:active {
            background-color: #005bb5;
        }
    </style>
</head>
<body>
    <div class="icon">✉️</div>
    <h2>You've Received a Card!</h2>
    <p>To open your personalized card, please download the Rivon app.</p>
    
    <a href="#" id="downloadBtn" class="btn">Download Rivon</a>

    <script>
        window.onload = function() {
            var playStoreLink = "https://play.google.com/store/apps/details?id=com.greetingcards.invitationmaker.rivon";
            var appStoreLink = "https://apps.apple.com/us/app/rivon/id123456789";

            var userAgent = navigator.userAgent || navigator.vendor || window.opera;
            var isAndroid = /android/i.test(userAgent);
            var isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;
            
            var btn = document.getElementById("downloadBtn");
            if (isAndroid) {
                btn.href = playStoreLink;
            } else if (isIOS) {
                btn.href = appStoreLink;
            } else {
                // Desktop fallback
                btn.href = playStoreLink; 
                btn.innerText = "Get it on Google Play";
            }
        };
    </script>
</body>
</html>
